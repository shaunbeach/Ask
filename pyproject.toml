[project]
name = "ask-tui"
version = "0.1.0"
description = "A llama.cpp terminal assistant that reads your tmux panes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["llama.cpp", "tmux", "tui", "terminal", "assistant", "textual"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "textual~=8.2",
    "httpx~=0.28",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/YOUR-USER/ask"
Issues = "https://github.com/YOUR-USER/ask/issues"

[project.scripts]
ask = "ask_tui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ask_tui"]
